<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Staff sign in · SLT Customer Intelligence</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f6fb;color:#1d2940;font-family:Arial,sans-serif;padding:20px;box-sizing:border-box}
    .login-card{width:min(440px,100%);border:1px solid #dbe4ef;border-radius:18px;background:#fff;box-shadow:0 18px 46px rgba(22,45,76,.12);padding:34px;box-sizing:border-box}
    .logo{height:46px;width:46px;background:#1864b1;border-radius:12px;color:white;font-size:27px;font-weight:bold;display:grid;place-items:center;margin-bottom:18px}
    h1{margin:0 0 9px;font-size:25px;color:#132a46}.intro{font-size:14px;line-height:1.5;color:#51657d;margin-bottom:25px}
    label{display:block;font-size:13px;font-weight:bold;margin:15px 0 7px}
    input{display:block;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #aebfd1;padding:12px 13px;font-size:15px;background:#fff;color:#24334c}
    button{width:100%;margin-top:24px;border:0;background:#196cbd;color:#fff;border-radius:8px;padding:13px;cursor:pointer;font-weight:700;font-size:15px}
    button:hover{background:#0e5599}.error{border:1px solid #edb5b5;background:#fff2f2;color:#8a2b2b;padding:12px;font-size:13px;border-radius:8px}
    .note{font-size:12px;color:#61748d;margin-top:20px;line-height:1.5}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">S</div>
    <h1>Staff sign in</h1>
    <p class="intro">SLT Customer Payment Intelligence · Local training prototype</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('staff_auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required maxlength="32" autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="note">Use only test accounts created locally in Step 18. Do not use an SLT password or real customer information.</p>
  </main>
</body>
</html>
